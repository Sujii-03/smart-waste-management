{% extends "app.html" %}{% block title %}Classify{% endblock %}{% block page %}classify{% endblock %}{% block content %}
<h3 class="fw-bold mb-3">Waste classification</h3><div class="row g-3"><div class="col-lg-6"><div class="cardx p-4">
<label class="drop w-100" for="file"><div id="ph"><i class="bi bi-cloud-arrow-up fs-1 text-success"></i><p class="mb-0">Click to upload a JPG or PNG (max 5 MB)</p></div><img id="prev" class="d-none"></label>
<input type="file" id="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" class="d-none">
<button class="btn btn-eco w-100 mt-3" id="go" disabled><i class="bi bi-stars"></i> Classify Waste</button></div></div>
<div class="col-lg-6"><div class="cardx p-4" id="res"><p class="text-muted mb-0">Your result will appear here.</p></div></div></div>{% endblock %}
