{% extends "public.html" %}{% block title %}Log in{% endblock %}{% block page %}login{% endblock %}{% block content %}
<div class="container py-5"><div class="auth-box mx-auto cardx p-4 p-md-5"><h3 class="fw-bold mb-1">Welcome back</h3><p class="text-muted">Log in to continue.</p>
<div class="alert alert-danger d-none" id="err"></div>
<form id="f" novalidate><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required><div class="invalid-feedback">Enter a valid email.</div></div>
<div class="mb-2"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required><div class="invalid-feedback">Password is required.</div></div>
<div class="text-end mb-3"><a href="/forgot" class="small">Forgot password?</a></div>
<button class="btn btn-eco w-100">Log in</button></form><p class="text-center mt-3 mb-0 small">No account? <a href="/register">Register</a></p></div></div>{% endblock %}
